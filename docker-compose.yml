services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_path_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - career_path_net

  web:
    image: nginx:alpine
    container_name: career_path_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - career_path_net

  db:
    image: mysql:8.0
    container_name: career_path_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: career_path_db
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_USER: career_user
      MYSQL_PASSWORD: career_secret_password
      TZ: Asia/Bangkok
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - career_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - career_path_net

networks:
  career_path_net:
    driver: bridge

volumes:
  career_mysql_data:
    driver: local